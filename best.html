<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Rated - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="asset/remove logo marhas.png">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #ebf0f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Liquid Glass Navbar Styling */
        #navbar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.75rem 2rem;
            z-index: 1000;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .navbar-brand {
            color: #212529 !important;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin-bottom: 0;
            align-items: center;
        }
        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: #495057;
            text-decoration: none;
            transition: 0.3s ease;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #0d6efd;
        }
        .hamburger {
            display: none;
            cursor: pointer;
            border: none;
            background: none;
            width: 30px;
            height: 20px;
            position: relative;
            z-index: 1001;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #212529;
            position: absolute;
            transition: 0.3s ease;
        }
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 9px; }
        .hamburger span:nth-child(3) { top: 18px; }
        
        .filter-section {
            padding: 100px 0 30px;
        }
        .btn-filter-active {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            padding: 6px 16px;
            font-weight: 500;
        }
        .btn-filter-inactive {
            background-color: white;
            color: #adb5bd;
            border: 1px solid white;
            border-radius: 6px;
            font-size: 0.85rem;
            padding: 6px 16px;
            font-weight: 500;
        }
        .card-produk {
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 12px;
            background-color: white;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .img-container {
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            height: 160px;
            background-color: #f8f9fa;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .judul-produk {
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #212529;
            margin-bottom: 8px;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .badge-gratis {
            background-color: #e6f0ff;
            color: #0d6efd;
            border-radius: 4px;
            font-size: 0.75rem;
            padding: 3px 12px;
            font-weight: 600;
        }
        .teks-pembuat {
            color: #adb5bd;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .bintang {
            color: #ffc107;
            font-size: 0.8rem;
        }
        .bintang-kosong {
            color: #e9ecef;
            font-size: 0.8rem;
        }
        .teks-sale {
            color: #adb5bd;
            font-size: 0.8rem;
        }
        .btn-preview {
            background-color: #343a40;
            color: white;
            border-radius: 6px;
            font-size: 0.75rem;
            padding: 6px 16px;
            border: none;
            text-decoration: none;
        }
        .btn-preview:hover {
            background-color: #212529;
            color: white;
        }
        @media (max-width: 768px) {
            #navbar {
                width: 95%;
                padding: 0.5rem 1.25rem;
                top: 10px;
                border-radius: 30px;
            }
            .nav-links {
                position: fixed;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100vh;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: 0.3s ease;
            }
            .nav-links.active { left: 0; }
            .nav-links a { font-size: 1.25rem; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="container nav-container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="asset/remove logo marhas.png" alt="logo" width="40" class="me-2">
                <strong>SMK Marhas Margahayu</strong>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Beranda</a></li>
                <li><a href="index.html#tentang" class="nav-link">Tentang</a></li>
                <li><a href="index.html#produk" class="nav-link">Program</a></li>
                <li><a href="#kontak" class="nav-link">Kontak</a></li>
            </ul>
            <button class="hamburger" aria-label="Toggle Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
</body>
</html>
