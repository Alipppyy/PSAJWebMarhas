<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK Marhas Margahayu</title>
    <meta name="description" content="SMK Marhas Margahayu - Sekolah Menengah Kejuruan Berbasis Teknologi terbaik di Indonesia">

    <link rel="icon" type="image/x-icon" href="asset/remove logo marhas.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    :root {
        --bg-color: #0A0A0F;
        --surface-color: #161622;
        --surface-hover: #1f1f2e;
        --primary: #E8FF47;
        --primary-hover: #d4eb33;
        --text-main: #F8F9FA;
        --text-muted: #9CA3AF;
        --transition: 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
    }
    #navbar {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 1100px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50px;
        padding: 0.75rem 2rem;
        z-index: 1000;
        transition: var(--transition);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    #navbar.scrolled {
        background: rgba(10, 10, 15, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .navbar-brand { color: var(--text-main) !important; font-size: 1.1rem; font-weight: 700; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; list-style: none; margin-bottom: 0; align-items: center; }
    .nav-links a { font-size: 0.9rem; font-weight: 500; color: rgba(255, 255, 255, 0.75); text-decoration: none; transition: var(--transition); }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); }
    .hamburger { display: none; cursor: pointer; border: none; background: none; width: 30px; height: 20px; position: relative; z-index: 1001; }
    .hamburger span { display: block; width: 100%; height: 2px; background-color: var(--text-main); position: absolute; transition: var(--transition); }
    .hamburger span:nth-child(1) { top: 0; }
    .hamburger span:nth-child(2) { top: 9px; }
    .hamburger span:nth-child(3) { top: 18px; }
    .hamburger.active span:nth-child(1) { transform: rotate(45deg); top: 9px; background-color: var(--primary); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg); top: 9px; background-color: var(--primary); }
    @media (max-width: 768px) {
        #navbar { width: 95%; padding: 0.5rem 1.25rem; top: 10px; border-radius: 30px; }
        .nav-links { position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); flex-direction: column; align-items: center; justify-content: center; transition: var(--transition); }
        .nav-links.active { left: 0; }
        .nav-links a { font-size: 1.25rem; }
        .hamburger { display: block; }
    }
</style>
<body>
    <nav id="navbar">
        <div class="container nav-container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="asset/remove logo marhas.png" alt="logo" width="40" class="me-2">
                <strong>SMK MARHAS</strong>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Beranda</a></li>
                <li><a href="index.html#tentang" class="nav-link">Tentang</a></li>
                <li><a href="index.html#produk" class="nav-link">Program</a></li>
                <li><a href="#kontak" class="nav-link">Kontak</a></li>
            </ul>
            <button class="hamburger" aria-label="Toggle Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
</body>
</html>
